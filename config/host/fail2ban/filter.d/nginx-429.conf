[Definition]
failregex = ^.*? [a-f0-9]+ 429 .*?ip=<HOST>.*$
# The feed throttle (proxy/config/feed-throttle.conf) answers repeat
# unconditional feed polls with 429; those are polite pollers, not floods.
# Only its own 429s are ignored: it runs after limit_req passed, so they log
# lrs=PASSED (or lrs=- without limit_req). A limit_req rejection logs
# lrs=REJECTED and still counts, even on a feed path.
ignoreregex = ^.*? [a-f0-9]+ 429 \S+ \S+ https?://[^/ ]+/(feed\.rss|feed|rss|atom\.xml|feed\.xml|rss\.xml|index\.xml)/?(\?\S*)?\s.*?\slrs=(?!REJECTED\b)
