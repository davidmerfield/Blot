[Definition]
failregex = ^.*? [a-f0-9]+ 429 .*?ip=<HOST>.*$
# The feed throttle (proxy/config/feed-throttle.conf) answers repeat
# unconditional feed polls with 429; those are polite pollers, not floods.
ignoreregex = ^.*? [a-f0-9]+ 429 \S+ \S+ https?://[^/ ]+/(feed\.rss|feed|rss|atom\.xml|feed\.xml|rss\.xml|index\.xml)/?(\?\S*)?\s
