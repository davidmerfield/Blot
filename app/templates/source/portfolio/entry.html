{{> header}}

<div class="entry align-{{navigation_alignment}}">
  
  <div class="nav">
    <a class="entry-close" href="/" onclick="return closeEntry()">
      <svg viewBox="0 0 36 36">
        <line x1="10" y1="10" x2="26" y2="26"></line>
        <line x1="26" y1="10" x2="10" y2="26"></line>
      </svg>
    </a>
    {{#show_adjacent_posts}}
    {{^entry.page}}
    <div>
      <a class="entry-previous" {{#entry.previous}}href="{{entry.previous.url}}"{{/entry.previous}}>
        <svg viewBox="0 0 36 36">
          <line x1="18" y1="18" x2="26" y2="10"></line>
          <line x1="18" y1="18" x2="26" y2="26"></line>
        </svg>
      </a>
    </div>
    <a>&nbsp;</a>
    {{/entry.page}}
    {{/show_adjacent_posts}}
  </div>    
  
  <div class="contents">
  {{#entry}}
    {{{html}}}
    {{> pluginHTML}}
  
    {{#show_adjacent_posts}}
    <script type="text/javascript">

document.onkeydown = checkKey;

function checkKey(e) {

    e = e || window.event;

    var nextLink = document.querySelector("a.entry-next");
    var previousLink = document.querySelector("a.entry-previous");
    
    if (previousLink && previousLink.href && e.keyCode == '37') {
      window.location = previousLink.href
    }

     if (nextLink && nextLink.href && e.keyCode == '39') {
      window.location = nextLink.href
    }

}
    </script>
    {{/show_adjacent_posts}}
  {{/entry}}
  </div>

  <div class="nav">
    <a class="entry-close" href="/" onclick="return closeEntry()">
      <svg viewBox="0 0 36 36">
        <line x1="10" y1="10" x2="26" y2="26"></line>
        <line x1="26" y1="10" x2="10" y2="26"></line>
      </svg>
    </a>
    {{#show_adjacent_posts}}
    {{^entry.page}}
    <div>
      <a class="entry-next" {{#entry.next}}href="{{entry.next.url}}"{{/entry.next}} >
        <svg viewBox="0 0 36 36">
          <line x1="10" y1="10" x2="18" y2="18"></line>
          <line x1="10" y1="26" x2="18" y2="18"></line>
        </svg>
      </a>
    </div>
    <a>&nbsp;</a>
    {{/entry.page}}
    {{/show_adjacent_posts}}
  </div>  
</div>

{{> footer}}
