# Throttle unconditional polling of RSS/Atom feeds on blog hosts.
#
# A feed reader that sends If-None-Match or If-Modified-Since gets a cheap 304
# and always passes. A client that re-fetches a feed without either header is
# refused with 429 until FEED_THROTTLE_SECONDS have passed since its last
# unconditional request for the same IP + host + path. This runs in the access
# phase, before the proxy cache, so a cache HIT is throttled too. The 429 is
# answered here and never reaches proxy_cache, so it is not cached.
#
# Needs `lua_shared_dict feed_throttle` (http.conf) and the $whitelist geo.
# Exempt: whitelisted IPs (macserver, CDN), loopback and private ranges.
access_by_lua_block {
    local FEED_THROTTLE_SECONDS = 15 * 60

    local FEED_PATHS = {
        ["/feed.rss"] = true,
        ["/feed"] = true,
        ["/rss"] = true,
        ["/atom.xml"] = true,
        ["/feed.xml"] = true,
        ["/rss.xml"] = true,
        ["/index.xml"] = true,
    }

    local var = ngx.var
    local method = ngx.req.get_method()

    if method ~= "GET" and method ~= "HEAD" then
        return
    end

    -- ngx.var.uri is decoded and has no query string
    local path = string.lower(var.uri)
    if #path > 1 and string.sub(path, -1) == "/" then
        path = string.sub(path, 1, -2)
    end

    if not FEED_PATHS[path] then
        return
    end

    -- Conditional requests can be answered with a 304, let them through
    local inm = var.http_if_none_match
    local ims = var.http_if_modified_since
    if (inm and inm ~= "") or (ims and ims ~= "") then
        return
    end

    if var.whitelist == "1" then
        return
    end

    local ip = var.remote_addr

    -- Loopback, link-local and private ranges (IPv4 and IPv6)
    local a, b = string.match(ip, "^(%d+)%.(%d+)%.%d+%.%d+$")
    if a then
        a, b = tonumber(a), tonumber(b)
        if a == 10 or a == 127
            or (a == 172 and b >= 16 and b <= 31)
            or (a == 192 and b == 168)
            or (a == 169 and b == 254) then
            return
        end
    else
        local lower = string.lower(ip)
        local prefix = string.sub(lower, 1, 2)
        if lower == "::1" or prefix == "fc" or prefix == "fd" or prefix == "fe" then
            return
        end
    end

    local dict = ngx.shared.feed_throttle
    local key = ip .. "|" .. string.lower(var.host) .. "|" .. path
    local now = ngx.now()

    local function refuse(remaining)
        -- Answered here rather than with ngx.exit(429): reverse-proxy-base.conf
        -- maps 429 to the "upstream offline" error page, which would replace
        -- the body and drop Retry-After.
        ngx.status = 429
        ngx.header["Retry-After"] = remaining
        ngx.header["Content-Type"] = "text/plain; charset=utf-8"
        ngx.header["Cache-Control"] = "no-store"
        ngx.say("Too many requests. Send If-None-Match or If-Modified-Since, or retry in ", remaining, " seconds.")
        return ngx.exit(ngx.HTTP_OK)
    end

    local function remaining_for(started)
        local remaining = FEED_THROTTLE_SECONDS
        if started then
            remaining = math.ceil(FEED_THROTTLE_SECONDS - (now - started))
        end
        if remaining < 1 then
            remaining = 1
        end
        return remaining
    end

    if method == "HEAD" then
        -- A HEAD costs no body bytes: refuse it while the window is open but
        -- never open one, so a probe does not lock out the GET that follows.
        local started = dict:get(key)
        if started then
            return refuse(remaining_for(started))
        end
        return
    end

    -- add is atomic: it only succeeds for the first request in the window
    local ok, err = dict:add(key, now, FEED_THROTTLE_SECONDS)
    if ok then
        return
    end
    if err ~= "exists" then
        -- fail open
        ngx.log(ngx.ERR, "feed throttle: ", err)
        return
    end

    return refuse(remaining_for(dict:get(key)))
}
