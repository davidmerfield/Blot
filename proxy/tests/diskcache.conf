user {{user}} {{group}};

events {
    worker_connections 1000;
}

http {

    log_format access_log_format '[$time_local] ID=$request_id STATUS=$status REQ_TIME=$request_time $scheme://$host$request_uri';

    error_log {{{data_directory}}}/error.log debug;
    access_log {{{data_directory}}}/access.log access_log_format;

    lua_shared_dict diskcache_locks 10m;

    # as http.conf: a fill an error_page redirected still holds its lock
    log_by_lua_block { diskcache:release() }
    lua_package_path "{{{lua_directory}}}/?.lua;;";

    init_by_lua_block {
        diskcache = (require "diskcache").new({
            directory = "{{{cache_directory}}}",
            locks = "diskcache_locks",
        })
    }

    server {
        listen {{openresty.port}} default_server;

        location = /purge {
            content_by_lua_block {
                diskcache:purge()
            }
        }

        location = /health {
            return 200 'Hello, World!';
        }

        # Mirrors the disk_cache blocks of reverse-proxy-cache.conf (this
        # location) and blot-blogs.conf (the locations below)
        location / {
            set $cache_key $scheme://$host$request_uri;

            root {{{cache_directory}}};
            set $diskcache_path "/.none";

            add_header 'Blot-Server' 'test' always;

            # the plain bodies are compressed by nginx as on a hit in production
            gzip on;
            gzip_comp_level 6;
            gzip_proxied any;

            access_by_lua_block { diskcache:access() }
            try_files $diskcache_path @diskcache_fill;
        }

        location @diskcache_fill {
            set $cache_key $scheme://$host$request_uri;

            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";

            proxy_connect_timeout 250ms;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;

            proxy_pass http://127.0.0.1:{{node.port}};
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_redirect off;
            proxy_intercept_errors on;
            error_page 500 502 504 429 /error-upstream-offline.html;

            add_header 'Blot-Server' 'test' always;

            gzip on;
            gzip_comp_level 6;
            gzip_proxied any;

            set $diskcache_lock "";

            access_by_lua_block { diskcache:fill() }
            header_filter_by_lua_block { diskcache:header_filter() }
            body_filter_by_lua_block { diskcache:body_filter() }
            log_by_lua_block { diskcache:log() }
        }

        location = /error-upstream-offline.html {
            internal;
            return 500 'offline';
        }

        location /__diskcache/plain/ {
            internal;
            alias {{{cache_directory}}}/;
            add_header 'Blot-Server' 'test' always;
        }

        location /__diskcache/encoded/ {
            internal;
            alias {{{cache_directory}}}/;
            gzip off;
            add_header 'Blot-Server' 'test' always;
        }
    }
}
